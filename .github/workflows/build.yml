name: Build mod from ZIP

# Запускается при пуше ZIP-файла (или самого build.yml) и вручную из вкладки Actions
on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::В корне репозитория не найден ни один .zip файл"
            exit 1
          fi
          echo "Распаковываю: $ZIP"
          mkdir -p modsrc
          unzip -o -q "$ZIP" -d modsrc
          BUILD_FILE=$(find modsrc -maxdepth 3 -name build.gradle | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::В архиве не найден build.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Проект: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build jar
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Collect jar
        run: |
          mkdir -p out
          find "$PROJECT_DIR/build/libs" -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} out/ \;
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: out/*.jar

      - name: Publish release (прямая ссылка на .jar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка №${{ github.run_number }}
          files: out/*.jar
